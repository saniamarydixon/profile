<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sania Mary Dixon | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2BB6C7;
            --primary-dark: #1E97A5;
            --primary-light: #7FD4DF;
            --secondary: #5FC9D6;
            --accent: #B8EAF0;
            --bg: #F0F9FB;
            --bg-light: #FFFFFF;
            --bg-soft: #E0F4F7;
            --text: #1F1F2E;
            --text-muted: #6B6B7B;
            --text-light: #9999A8;
            --card-bg: #FFFFFF;
            --border: #D8ECEF;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        a { text-decoration: none; color: inherit; }

        /* ===== NAVBAR ===== */
        .navbar {
            background: var(--bg-light);
            padding: 0.8rem 1.5rem;
            position: sticky;
            top: 1rem;
            z-index: 100;
            max-width: 800px;
            margin: 1rem auto 0;
            border-radius: 50px;
            box-shadow: 0 8px 30px rgba(43,182,199,0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar .logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            padding-left: 0.5rem;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 0.3rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            transition: all 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary);
            background: var(--bg-soft);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 4px;
        }

        .hamburger span {
            width: 22px;
            height: 2px;
            background: var(--text);
            border-radius: 2px;
        }

        /* ===== HERO ===== */
        .hero {
            padding: 4rem 2rem 6rem;
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
            position: relative;
        }

        .hero-left { position: relative; }

        .hero-socials {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 2rem;
        }

        .social-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-light);
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s;
            cursor: pointer;
        }

        .social-circle:hover {
            transform: translateY(-4px) scale(1.1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .social-circle svg { width: 18px; height: 18px; }
        .social-circle.ig { background: linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); color:white; }
        .social-circle.gh { background: #24292e; color:white; }
        .social-circle.em { background: #EA4335; color:white; }
        .social-circle.yt { background: #FF0000; color:white; }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text);
            line-height: 1.1;
            margin-bottom: 1.5rem;
        }

        .hero h1 .name { color: var(--primary); }

        .hero-tagline {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 2.5rem;
            max-width: 480px;
        }

        /* ===== HERO RIGHT (with IMAGE) ===== */
        .hero-right {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 420px;
        }

        .hero-image-wrap {
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 25px 60px rgba(43,182,199,0.4);
            animation: floaty 4s ease-in-out infinite;
            overflow: hidden;
            position: relative;
            border: 6px solid white;
        }

        .hero-img {
            width: 90%;
            height: 90%;
            object-fit: contain;
            object-position: center;
        }

        @keyframes floaty {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* floating decorative bubbles around hero */
        .hero-right::before,
        .hero-right::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: var(--primary-light);
            opacity: 0.3;
            animation: floaty 5s ease-in-out infinite;
        }

        .hero-right::before {
            width: 60px;
            height: 60px;
            top: 5%;
            right: 5%;
            animation-delay: 1s;
        }

        .hero-right::after {
            width: 40px;
            height: 40px;
            bottom: 8%;
            left: 5%;
            animation-delay: 2s;
        }

        /* ===== ABOUT ===== */
        .about {
            background: var(--bg-light);
            padding: 6rem 2rem;
            position: relative;
        }

        .about-container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .about-image-wrap {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 420px;
        }

        .about-image-wrap::before,
        .about-image-wrap::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: var(--primary-light);
            opacity: 0.3;
            animation: floaty 6s ease-in-out infinite;
        }

        .about-image-wrap::before {
            width: 50px;
            height: 50px;
            top: 10%;
            left: 0%;
            animation-delay: 1s;
        }

        .about-image-wrap::after {
            width: 35px;
            height: 35px;
            bottom: 10%;
            right: 5%;
            animation-delay: 2s;
        }

        /* ===== ABOUT PHOTO ===== */
        .about-photo {
            position: relative;
            z-index: 1;
            width: 340px;
            height: 420px;
            border-radius: 180px;
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary-light), var(--accent));
            box-shadow: 0 25px 60px rgba(43,182,199,0.35);
            border: 6px solid white;
            animation: floaty 5s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .about-photo img {
            width: 90%;
            height: 90%;
            object-fit: contain;
            object-position: center;
        }

        .about-content h2 {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        .about-content p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.97rem;
            line-height: 1.8;
        }

        /* ===== SKILLS ===== */
        .skills {
            padding: 6rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-head {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .section-head h2 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .section-head h2 span { color: var(--primary); }

        .section-head p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .skill-card {
            background: var(--bg-light);
            border-radius: 20px;
            padding: 1.5rem 1.3rem;
            box-shadow: 0 8px 25px rgba(43,182,199,0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .skill-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(43,182,199,0.18);
        }

        .skill-card-head {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }

        .skill-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
        }

        .skill-name {
            font-weight: 600;
            color: var(--text);
            font-size: 0.95rem;
        }

        .skill-prof-label {
            color: var(--text-light);
            font-size: 0.75rem;
            margin-bottom: 0.4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .skill-prof-percent {
            font-weight: 700;
            color: var(--text);
        }

        .skill-progress-bar {
            height: 5px;
            background: var(--bg-soft);
            border-radius: 10px;
            overflow: hidden;
        }

        .skill-progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 1.5s ease;
            width: 0;
        }

        .sc-html .skill-icon, .sc-html .skill-progress-fill { background: #E34F26; }
        .sc-py   .skill-icon, .sc-py .skill-progress-fill   { background: #3776AB; }
        .sc-sql  .skill-icon, .sc-sql .skill-progress-fill  { background: #00758F; }

        /* ===== PROJECT ===== */
        .projects {
            background: var(--bg-light);
            padding: 6rem 2rem;
        }

        .project-wrap {
            max-width: 1000px;
            margin: 0 auto;
        }

        .project-card {
            background: linear-gradient(135deg, var(--bg-soft) 0%, #C7EAF0 100%);
            border-radius: 24px;
            padding: 3rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
            box-shadow: 0 15px 40px rgba(43,182,199,0.2);
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(43,182,199,0.25), transparent 70%);
            border-radius: 50%;
        }

        .project-visual {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .project-emoji-bubble {
            width: 220px;
            height: 220px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7rem;
            box-shadow: 0 20px 50px rgba(43,182,199,0.45);
            position: relative;
        }

        .project-info {
            position: relative;
            z-index: 1;
        }

        .project-badge {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 0.35rem 0.9rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: 0.5px;
        }

        .project-info h3 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 1rem;
        }

        .project-info p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .ptag {
            padding: 0.3rem 0.8rem;
            background: white;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .btn {
            padding: 0.9rem 1.8rem;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 6px 20px rgba(43,182,199,0.35);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(43,182,199,0.45);
        }

        /* ===== EDUCATION ===== */
        .education {
            padding: 6rem 2rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .edu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .edu-card {
            background: var(--bg-light);
            border-radius: 20px;
            padding: 2rem 1.5rem;
            box-shadow: 0 8px 25px rgba(43,182,199,0.1);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .edu-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: var(--primary);
        }

        .edu-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 45px rgba(43,182,199,0.18);
        }

        .edu-icon {
            width: 55px;
            height: 55px;
            background: var(--bg-soft);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 1.2rem;
        }

        .edu-type {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.4rem;
        }

        .edu-card h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.3rem;
        }

        .edu-card .institution {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .edu-details {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .edu-line {
            font-size: 0.83rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .edu-badge-pill {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.35rem 0.9rem;
            background: var(--primary);
            color: white;
            font-weight: 700;
            font-size: 0.75rem;
            border-radius: 15px;
        }

        /* ===== CONTACT ===== */
        .contact {
            background: linear-gradient(135deg, var(--bg-soft), #C7EAF0);
            padding: 6rem 2rem;
        }

        .contact-box {
            max-width: 700px;
            margin: 0 auto;
            background: var(--bg-light);
            border-radius: 28px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(43,182,199,0.2);
            text-align: center;
        }

        .contact-box h2 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .contact-box h2 span { color: var(--primary); }

        .contact-box > p {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .contact-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .contact-pill {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1rem 1.2rem;
            background: var(--bg-soft);
            border-radius: 14px;
            text-align: left;
            transition: all 0.3s;
        }

        .contact-pill:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-3px);
        }

        .contact-pill:hover .contact-pill-text { color: white; }
        .contact-pill:hover .contact-pill-label { color: rgba(255,255,255,0.7); }

        .contact-pill-icon {
            width: 38px;
            height: 38px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .contact-pill-label {
            font-size: 0.72rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .contact-pill-text {
            font-weight: 600;
            color: var(--text);
            font-size: 0.88rem;
        }

        /* ===== FOOTER ===== */
        .footer {
            background: var(--text);
            color: white;
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .footer-socials {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }

        .footer-socials a {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .footer-socials a:hover {
            background: var(--primary);
            transform: translateY(-3px);
        }

        .footer p { font-size: 0.85rem; opacity: 0.7; }
        .footer p strong { color: var(--primary); }

        /* ===== ANIMATIONS ===== */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== SCROLL TOP ===== */
        .scroll-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 45px;
            height: 45px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            font-size: 1.2rem;
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(43,182,199,0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 99;
        }

        .scroll-top.visible { opacity: 1; visibility: visible; }
        .scroll-top:hover { transform: translateY(-4px); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .hero { grid-template-columns: 1fr; text-align: center; padding: 3rem 1.5rem; }
            .hero-socials { justify-content: center; }
            .hero h1 { font-size: 2.5rem; }
            .hero-tagline { margin: 0 auto 2rem; }
            .about-container { grid-template-columns: 1fr; gap: 3rem; text-align: center; }
            .skills-grid { grid-template-columns: repeat(2, 1fr); }
            .project-card { grid-template-columns: 1fr; text-align: center; padding: 2rem; }
            .edu-grid { grid-template-columns: 1fr; }
            .contact-options { grid-template-columns: 1fr; }
            .contact-box { padding: 2rem 1.5rem; }
        }

        @media (max-width: 600px) {
            .navbar { padding: 0.6rem 1rem; margin: 0.5rem 1rem 0; }
            .nav-links { display: none; }
            .nav-links.active {
                display: flex;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--bg-light);
                flex-direction: column;
                padding: 1rem;
                border-radius: 20px;
                margin-top: 0.5rem;
                box-shadow: 0 10px 30px rgba(0,0,0,0.1);
                gap: 0.5rem;
            }
            .hamburger { display: flex; }
            .hero-image-wrap { width: 260px; height: 260px; }
            .hero h1 { font-size: 2rem; }
            .about-photo { width: 250px; height: 320px; border-radius: 140px; }
            .about-content h2 { font-size: 2rem; }
            .skills-grid { grid-template-columns: 1fr; }
            .section-head h2 { font-size: 1.8rem; }
            .project-emoji-bubble { width: 180px; height: 180px; font-size: 5rem; }
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="logo">Portfolio</div>
        <ul class="nav-links" id="navLinks">
            <li><a href="#home" class="active">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
        <div class="hamburger" onclick="document.getElementById('navLinks').classList.toggle('active')">
            <span></span><span></span><span></span>
        </div>
    </nav>

    <!-- ===== HERO ===== -->
    <section class="hero" id="home">
        <div class="hero-left fade-in">
